name: Backend Infra

# Infraestructura de AWS con Terraform. Se lanza a mano porque crear o destruir
# recursos tiene costo: primero plan, se revisa la salida, y luego apply.
# La variable del repositorio MODO_DESPLIEGUE elige la topología: ahorro (por defecto) o eks-costoso.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Qué hacer
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy
          - stop
          - start
      stack:
        description: Stack (all recorre los del modo; eks-costoso agrupa los que solo usa EKS)
        type: choice
        required: true
        default: all
        options:
          - all
          - network
          - container_registry
          - eks
          - data
          - messaging
          - cluster_addons
          - platform
          - ahorro
          - edge
          - eks-costoso

permissions:
  contents: read

# Dos applies simultáneos sobre el mismo estado se bloquean entre sí.
concurrency:
  group: backend-infra-dev
  cancel-in-progress: false

jobs:
  terraform:
    name: terraform ${{ inputs.action }} (${{ inputs.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      ENV: dev
      MODO: ${{ vars.MODO_DESPLIEGUE || 'ahorro' }}
      AUTO_APPROVE: "1"
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - name: Solo desde main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::La infraestructura se aplica desde main."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Crear EKS y las bases en un mismo apply supera la hora por defecto.
          role-duration-seconds: 10800

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Session Manager plugin
        if: env.MODO == 'ahorro' && inputs.action == 'start'
        run: |
          curl -sSfLo "$RUNNER_TEMP/session-manager-plugin.deb" \
            https://s3.amazonaws.com/session-manager-downloads/plugin/1.2.707.0/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"

      - name: terraform ${{ inputs.action }}
        working-directory: apps/backend
        env:
          ACTION: ${{ inputs.action }}
          STACK: ${{ inputs.stack }}
        run: |
          case "$ACTION" in
            plan) ./deploy/scripts/deploy-aws.sh plan "$STACK" ;;
            apply) ./deploy/scripts/deploy-aws.sh infra "$STACK" ;;
            destroy) ./deploy/scripts/deploy-aws.sh destroy "$STACK" ;;
            stop) ./deploy/scripts/deploy-aws.sh stop ;;
            start) ./deploy/scripts/deploy-aws.sh start ;;
          esac
