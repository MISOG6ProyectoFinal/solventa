name: Mobile APK

# Construye el APK del tag que CD acaba de desplegar y lo adjunta a ese release.
# La URL pública sale del output url del stack edge. No usa .env.example.
# También se puede lanzar a mano con el tag de un release ya publicado.
# El script exige Node 26, Java y el NDK y CMake fijados en la app Android.

on:
  workflow_call:
    inputs:
      version:
        description: Tag del release (por ejemplo v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Tag de un release existente (por ejemplo v1.2.3)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: mobile-apk-${{ inputs.version }}
  cancel-in-progress: false

env:
  ENV: dev

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout del release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Crear el .env de Mobile
        run: |
          stack="apps/backend/deploy/terraform/stacks/edge"
          terraform -chdir="$stack" init -input=false -reconfigure \
            -backend-config="../../environments/${ENV}/edge/backend.tfvars"
          API_BASE_URL="$(terraform -chdir="$stack" output -raw url)"
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::No se pudo obtener API_BASE_URL desde Terraform."
            exit 1
          fi
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "::error::API_BASE_URL no es HTTPS: $API_BASE_URL"
            exit 1
          fi
          printf 'API_BASE_URL=%s\n' "$API_BASE_URL" > apps/mobile/.env
          echo "Mobile API_BASE_URL=$API_BASE_URL"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar NDK, CMake y la plataforma Android
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::Este runner no trae ANDROID_HOME."
            exit 1
          fi
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          set -o pipefail
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.31.6"

      - name: Install Node dependencies
        run: npm ci

      - name: Build APK
        run: ./scripts/build-apk.sh

      - name: Adjuntar el APK al release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "$VERSION" dist/mobile-release.apk --clobber
