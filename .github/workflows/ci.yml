name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  detect-affected:
    runs-on: ubuntu-latest
    outputs:
      backend_affected: ${{ steps.backend.outputs.backend_affected }}
      mobile_affected: ${{ steps.mobile.outputs.mobile_affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Detect backend affected
        id: backend
        run: |
          if npx nx show projects --affected | grep -qx 'backend'; then
            echo "backend_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_affected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect mobile affected
        id: mobile
        run: |
          if npx nx show projects --affected | grep -qx 'mobile'; then
            echo "mobile_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile_affected=false" >> "$GITHUB_OUTPUT"
          fi

  lint-build:
    needs: detect-affected
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        if: needs.detect-affected.outputs.backend_affected == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        if: needs.detect-affected.outputs.backend_affected == 'true'
        run: python -m pip install poetry

      - name: Install backend dependencies
        if: needs.detect-affected.outputs.backend_affected == 'true'
        working-directory: apps/backend
        run: poetry install --no-interaction

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Run affected lint and build
        run: npx nx affected -t lint build

  backend-tests:
    needs: detect-affected
    if: needs.detect-affected.outputs.backend_affected == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install backend dependencies
        working-directory: apps/backend
        run: poetry install --no-interaction

      - name: Run backend tests with coverage
        run: npx nx run backend:test

      - name: Verificar reportes generados
        if: always()
        working-directory: apps/backend
        run: |
          echo "=== VERIFICANDO REPORTES GENERADOS ==="
          ls -l coverage.xml || echo "❌ coverage.xml no generado"
          ls -l test-results.xml || echo "❌ test-results.xml no generado"
          if [ -f "coverage.xml" ]; then
            echo "✅ coverage.xml generado correctamente"
            head -5 coverage.xml
          fi
          if [ -f "test-results.xml" ]; then
            echo "✅ test-results.xml generado correctamente"
            head -5 test-results.xml
          fi

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            apps/backend/coverage.xml
            apps/backend/test-results.xml

  mobile-tests:
    needs: detect-affected
    if: needs.detect-affected.outputs.mobile_affected == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Mobile environment
        run: cp apps/mobile/.env.example apps/mobile/.env

      - name: Typecheck Mobile
        run: npm run typecheck-mobile

      - name: Run mobile tests with coverage
        run: npx nx run mobile:test --configuration=ci

      - name: Verificar coverage de Mobile
        if: always()
        run: |
          if [ ! -f "apps/mobile/coverage/lcov.info" ]; then
            echo "❌ apps/mobile/coverage/lcov.info no generado"
            exit 1
          fi
          echo "✅ apps/mobile/coverage/lcov.info generado correctamente"

      - name: Publicar reportes de pruebas de Mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports
          path: apps/mobile/coverage/

  sonarless-mobile:
    name: Análisis de calidad con Sonarless (Mobile)
    needs: mobile-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Instalar herramientas de diagnóstico
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Descargar reportes de pruebas de Mobile
        uses: actions/download-artifact@v4
        with:
          name: mobile-test-reports
          path: apps/mobile/coverage

      - name: Verificar lcov de Mobile
        run: |
          if [ ! -f "apps/mobile/coverage/lcov.info" ]; then
            echo "⚠️ lcov.info no está en apps/mobile/coverage/, buscando en subcarpetas..."
            FOUND=$(find apps/mobile -name "lcov.info" | head -n 1)
            if [ -n "$FOUND" ]; then
              mkdir -p apps/mobile/coverage
              mv "$FOUND" apps/mobile/coverage/lcov.info
              echo "✅ lcov.info movido a apps/mobile/coverage/"
            fi
          fi

          if [ ! -f "apps/mobile/coverage/lcov.info" ]; then
            echo "❌ apps/mobile/coverage/lcov.info no encontrado. No se ejecuta Sonarless Mobile sin coverage."
            exit 1
          fi

          echo "✅ apps/mobile/coverage/lcov.info listo"
          ls -lh apps/mobile/coverage/lcov.info

      - name: Configurar análisis Sonar Mobile
        run: |
          cat > sonar-project.properties <<'EOF'
          sonar.javascript.lcov.reportPaths=apps/mobile/coverage/lcov.info
          sonar.tests=apps/mobile/src
          sonar.test.inclusions=apps/mobile/src/**/*.spec.tsx,apps/mobile/src/test-setup.ts,apps/mobile/src/test-file-stub.js
          sonar.exclusions=apps/mobile/src/**/*.spec.tsx,apps/mobile/src/test-setup.ts,apps/mobile/src/test-file-stub.js
          sonar.coverage.exclusions=apps/mobile/src/**/*.spec.tsx,apps/mobile/src/test-setup.ts,apps/mobile/src/test-file-stub.js
          EOF

      - name: Sonarless Scan
        uses: gitricko/sonarless@v1.3
        id: sonarless-scan
        with:
          sonar-source-path: "apps/mobile/src"
          sonar-project-key: "solventa-mobile"
          sonar-project-name: "Solventa-Mobile"
          sonar-metrics-path: "sonar-metrics-mobile.json"

      - name: Mostrar baseline Sonar Mobile
        run: |
          set -e
          METRICS_FILE="sonar-metrics-mobile.json"
          if [ ! -f "$METRICS_FILE" ]; then
            echo "❌ No se generó ${METRICS_FILE}"
            exit 1
          fi

          echo "📋 === ARCHIVO DE MÉTRICAS ==="
          cat "$METRICS_FILE"

          get_metric() {
            jq -r --arg key "$1" '.component.measures[]? | select(.metric == $key) | .value // empty' "$METRICS_FILE"
          }

          show_metric() {
            local label=$1
            local key=$2
            local suffix=${3:-}
            local value
            value=$(get_metric "$key")
            if [ -z "$value" ]; then
              echo "${label}: no disponible (métrica '${key}' ausente)"
            else
              echo "${label}: ${value}${suffix}"
            fi
          }

          echo ""
          echo "Mobile Sonar Baseline"
          echo "---------------------"
          show_metric "Coverage" "coverage" "%"
          show_metric "Duplication" "duplicated_lines_density" "%"
          show_metric "Code Smells" "code_smells"
          show_metric "Violations" "violations"
          show_metric "Open issues" "open_issues"
          show_metric "Bugs" "bugs"
          show_metric "Vulnerabilities" "vulnerabilities"
          show_metric "Security Hotspots" "security_hotspots"
          show_metric "Security Rating" "security_rating"
          echo ""
          echo "Métricas devueltas por Sonarless:"
          jq -r '.component.measures[]? | "\(.metric)=\(.value)"' "$METRICS_FILE"

      - name: Publicar métricas Sonar Mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-sonar-metrics
          path: sonar-metrics-mobile.json
          if-no-files-found: warn

  sonarless-backend:
    name: Análisis de calidad con Sonarless
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Instalar herramientas de diagnóstico
        run: sudo apt-get update && sudo apt-get install -y jq curl bc

      - name: Descargar reportes de pruebas
        uses: actions/download-artifact@v4
        with:
          name: backend-test-reports
          path: apps/backend

      - name: Verificar ubicación de coverage.xml y test-results.xml
        run: |
          echo "📄 Contenido actual de apps/backend:"
          ls -lh apps/backend || true
          echo ""
          if [ ! -f "apps/backend/coverage.xml" ]; then
            echo "⚠️ coverage.xml no encontrado, buscando en subcarpetas..."
            FOUND=$(find apps/backend -name "coverage.xml" | head -n 1)
            if [ -n "$FOUND" ]; then
              mv "$FOUND" ./apps/backend/coverage.xml
              echo "✅ coverage.xml movido a apps/backend/"
            else
              echo "❌ coverage.xml no encontrado en ninguna carpeta"
            fi
          fi

          if [ ! -f "apps/backend/test-results.xml" ]; then
            echo "⚠️ test-results.xml no encontrado, buscando en subcarpetas..."
            FOUND=$(find apps/backend -name "test-results.xml" | head -n 1)
            if [ -n "$FOUND" ]; then
              mv "$FOUND" ./apps/backend/test-results.xml
              echo "✅ test-results.xml movido a apps/backend/"
            else
              echo "❌ test-results.xml no encontrado en ninguna carpeta"
            fi
          fi

          echo ""
          echo "📊 Archivos listos para Sonarless:"
          ls -lh apps/backend/coverage.xml apps/backend/test-results.xml || true

      - name: Sonarless Scan
        uses: gitricko/sonarless@v1.3
        id: sonarless-scan
        with:
          sonar-source-path: "apps/backend"
          sonar-project-key: "solventa-backend"
          sonar-project-name: "Solventa-Backend"
          sonar-metrics-path: "sonar-metrics.json"

      - name: Obtener detalles específicos de problemas
        run: |
          echo "🔍 === INTENTANDO OBTENER DETALLES DE PROBLEMAS ==="
          
          # Esperar un poco para que SonarQube esté completamente listo
          sleep 10
          
          SONAR_URL="http://localhost:9234"
          SONAR_AUTH='admin:Son@rless123'
          
          # Intentar obtener issues desde la API de SonarQube local
          echo "Intentando conectar a SonarQube local en ${SONAR_URL}..."
          
          PROJECT_KEY=$(jq -r '.component.key // empty' sonar-metrics.json)
          if [ -z "$PROJECT_KEY" ]; then
            echo "❌ PROJECT_KEY vacío: no se pudo leer .component.key desde sonar-metrics.json"
          else
            echo "🔍 Obteniendo issues desde SonarQube para ${PROJECT_KEY}..."
            
            # Probar diferentes endpoints de la API
            echo "Probando diferentes endpoints de la API..."
            
            # Endpoint 1: Issues search
            echo "1. Probando /api/issues/search..."
            curl -s -G -u "$SONAR_AUTH" \
              --data-urlencode "componentKeys=${PROJECT_KEY}" \
              --data-urlencode "resolved=false" \
              --data-urlencode "ps=500" \
              "${SONAR_URL}/api/issues/search" > sonar-issues.json
            
            # Verificar si el archivo tiene contenido válido
            if [ -f "sonar-issues.json" ] && [ -s "sonar-issues.json" ] && jq empty sonar-issues.json 2>/dev/null; then
              echo "✅ Issues obtenidos exitosamente"
              
              # Mostrar resumen
              TOTAL_ISSUES=$(jq '.total // 0' sonar-issues.json)
              echo "📊 Total de problemas encontrados: $TOTAL_ISSUES"
              
              if [ "$TOTAL_ISSUES" -gt 0 ]; then
                echo ""
                echo "🔍 === DETALLES DE PROBLEMAS ==="
                
                # Mostrar cada problema con detalles
                jq -r '.issues[]? | "📁 \(.component) - Línea \(.line)" as $location | "  • \(.message)" as $message | "  🏷️  Tipo: \(.type) | Severidad: \(.severity) | Regla: \(.rule)" as $details | "\($location)\n\($message)\n\($details)\n"' sonar-issues.json
                
                echo ""
                echo "📊 === RESUMEN POR TIPO ==="
                jq -r '.issues | group_by(.type) | .[] | "\(.[0].type): \(length) problemas"' sonar-issues.json
                
                echo ""
                echo "📊 === RESUMEN POR SEVERIDAD ==="
                jq -r '.issues | group_by(.severity) | .[] | "\(.[0].severity): \(length) problemas"' sonar-issues.json
              else
                echo "✅ No se encontraron problemas de calidad"
              fi
            else
              echo "⚠️  Endpoint /api/issues/search no funcionó, probando alternativas..."
              
              # Endpoint 2: Component measures
              echo "2. Probando /api/measures/component..."
              curl -s -G -u "$SONAR_AUTH" \
                --data-urlencode "component=${PROJECT_KEY}" \
                --data-urlencode "metricKeys=issues,code_smells,bugs,vulnerabilities" \
                "${SONAR_URL}/api/measures/component" > sonar-measures.json
              
              if [ -f "sonar-measures.json" ] && [ -s "sonar-measures.json" ] && jq empty sonar-measures.json 2>/dev/null; then
                echo "✅ Medidas obtenidas exitosamente"
                echo ""
                echo "📊 === MEDIDAS DETALLADAS ==="
                jq -r '.component.measures[]? | "📈 \(.metric): \(.value)"' sonar-measures.json
              else
                echo "❌ No se pudieron obtener los issues desde ningún endpoint"
                echo "   Esto puede indicar que la API no está disponible o las credenciales son incorrectas"
              fi
            fi
          fi

      - name: Mostrar métricas de Sonarless
        run: |
          set -e
          METRICS_FILE="sonar-metrics.json"
          
          echo "📊 === MÉTRICAS DE CALIDAD ==="
          cat "$METRICS_FILE"
          
          # Función para obtener métricas
          get_metric() {
            local key=$1
            jq -r ".component.measures[] | select(.metric == \"$key\").value" "$METRICS_FILE"
          }
          
          # Obtener métricas principales
          DUPLICATION=$(get_metric "duplicated_lines_density")
          CODE_SMELLS=$(get_metric "code_smells")
          VIOLATIONS=$(get_metric "violations")
          OPEN_ISSUES=$(get_metric "open_issues")
          SECURITY_RATING=$(get_metric "security_rating")
          SECURITY_HOTSPOTS=$(get_metric "security_hotspots")
          BUGS=$(get_metric "bugs")
          VULNERABILITIES=$(get_metric "vulnerabilities")
          COVERAGE=$(get_metric "coverage")
          LINES=$(get_metric "lines")
          NCLOC=$(get_metric "ncloc")
          
          echo ""
          echo "🔍 === RESUMEN DE MÉTRICAS ==="
          echo "Líneas de código (ncloc): ${NCLOC}"
          echo "Cobertura de pruebas: ${COVERAGE}%"
          echo "Duplicación: ${DUPLICATION}%"
          echo "Code Smells: ${CODE_SMELLS}"
          echo "Violaciones: ${VIOLATIONS}"
          echo "Issues abiertos: ${OPEN_ISSUES}"
          echo "Rating de seguridad: ${SECURITY_RATING}"
          echo "Security Hotspots: ${SECURITY_HOTSPOTS}"
          echo "Bugs: ${BUGS}"
          echo "Vulnerabilidades: ${VULNERABILITIES}"
          
          # Mostrar archivo de métricas completo para debugging
          echo ""
          echo "📋 === ARCHIVO DE MÉTRICAS COMPLETO ==="
          cat "sonar-metrics.json"
          
          # Verificar si hay métricas disponibles
          MEASURES_COUNT=$(jq '.component.measures | length' "$METRICS_FILE")
          if [ "$MEASURES_COUNT" -gt 0 ]; then
            echo ""
            echo "✅ Se encontraron $MEASURES_COUNT métricas de calidad"
            echo "   Revisa los valores arriba para identificar problemas"
          else
            echo ""
            echo "⚠️  No se encontraron métricas de calidad"
            echo "   Esto puede indicar que el scan falló o no hay problemas detectados"
          fi
          
          # Validación de Quality Gates
          echo ""
          echo "🚪 === VALIDACIÓN DE QUALITY GATES ==="
          
          if [[ -z "$DUPLICATION" || -z "$CODE_SMELLS" || -z "$VIOLATIONS" || -z "$OPEN_ISSUES" || -z "$SECURITY_RATING" || -z "$SECURITY_HOTSPOTS" || -z "$BUGS" || -z "$VULNERABILITIES" || -z "$COVERAGE" ]]; then
            echo "❌ Error: alguna métrica está vacía"
            exit 1
          fi
          
          # ============================================================
          # BASELINE DE CALIDAD DEL PROYECTO
          # ============================================================
          # NO aumente estos límites para hacer pasar el pipeline.
          #
          # Si este job falla, revise primero "DETALLES DE PROBLEMAS"
          # en este mismo pipeline y corrija la regresión que introdujo
          # el cambio. El objetivo es mantener o reducir este baseline,
          # nunca relajar los límites para dejar el deploy en verde.
          # ============================================================

          # Validar duplicación (debe mantenerse en 0%)
          if (( $(echo "$DUPLICATION > 0.0" | bc -l) )); then
            echo "❌ Duplication density (${DUPLICATION}%) exceeds limit (0.0%)"
            exit 1
          else
            echo "✅ Duplication density: ${DUPLICATION}% (OK)"
          fi

          # Validar code smells (baseline: 5 TODO aceptados)
          if (( CODE_SMELLS > 5 )); then
            echo "❌ Code smells (${CODE_SMELLS}) exceed limit (5)"
            exit 1
          else
            echo "✅ Code smells: ${CODE_SMELLS} (OK)"
          fi

          # Validar violations (baseline: 5 TODO aceptados)
          if (( VIOLATIONS > 5 )); then
            echo "❌ Violations (${VIOLATIONS}) exceed limit (5)"
            exit 1
          else
            echo "✅ Violations: ${VIOLATIONS} (OK)"
          fi

          # Validar open issues (baseline: 5 TODO aceptados)
          if (( OPEN_ISSUES > 5 )); then
            echo "❌ Open issues (${OPEN_ISSUES}) exceed limit (5)"
            exit 1
          else
            echo "✅ Open issues: ${OPEN_ISSUES} (OK)"
          fi

          # Validar bugs (debe ser 0)
          if (( BUGS != 0 )); then
            echo "❌ Bugs (${BUGS}) exceed limit (0)"
            exit 1
          else
            echo "✅ Bugs: ${BUGS} (OK)"
          fi

          # Validar security rating (debe mantenerse en 1.0)
          if (( $(echo "$SECURITY_RATING > 1.0" | bc -l) )); then
            echo "❌ Security rating (${SECURITY_RATING}) exceeds limit (1.0)"
            exit 1
          else
            echo "✅ Security rating: ${SECURITY_RATING} (OK)"
          fi

          # Validar security hotspots (baseline actual, sin resolver todavía)
          if (( SECURITY_HOTSPOTS > 20 )); then
            echo "❌ Security hotspots (${SECURITY_HOTSPOTS}) exceed limit (20)"
            exit 1
          else
            echo "✅ Security hotspots: ${SECURITY_HOTSPOTS} (OK)"
          fi

          # Validar vulnerabilidades (debe ser 0)
          if (( VULNERABILITIES != 0 )); then
            echo "❌ Vulnerabilities (${VULNERABILITIES}) exceed limit (0)"
            exit 1
          else
            echo "✅ Vulnerabilities: ${VULNERABILITIES} (OK)"
          fi

          # Validar coverage importado por Sonar
          if (( $(echo "$COVERAGE < 85.0" | bc -l) )); then
            echo "❌ Coverage (${COVERAGE}%) is below limit (85.0%)"
            exit 1
          else
            echo "✅ Coverage: ${COVERAGE}% (OK)"
          fi

          echo ""
          echo "🎉 === TODOS LOS QUALITY GATES PASARON ==="
          echo "✅ === ANÁLISIS DE SONARLESS COMPLETADO ==="
          echo "   Los detalles de problemas se muestran arriba para revisión"

