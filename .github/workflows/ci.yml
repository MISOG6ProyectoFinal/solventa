name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  detect-affected:
    runs-on: ubuntu-latest
    outputs:
      backend_affected: ${{ steps.backend.outputs.backend_affected }}
      mobile_affected: ${{ steps.mobile.outputs.mobile_affected }}
      web_affected: ${{ steps.web.outputs.web_affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Detect backend affected
        id: backend
        run: |
          if npx nx show projects --affected | grep -qx 'backend'; then
            echo "backend_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_affected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect mobile affected
        id: mobile
        run: |
          if npx nx show projects --affected | grep -qx 'mobile'; then
            echo "mobile_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile_affected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect web affected
        id: web
        run: |
          if npx nx show projects --affected | grep -qx 'web.solventa.angular'; then
            echo "web_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_affected=false" >> "$GITHUB_OUTPUT"
          fi

  lint-build:
    needs: detect-affected
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        if: needs.detect-affected.outputs.backend_affected == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        if: needs.detect-affected.outputs.backend_affected == 'true'
        run: python -m pip install poetry

      - name: Install backend dependencies
        if: needs.detect-affected.outputs.backend_affected == 'true'
        working-directory: apps/backend
        run: poetry install --no-interaction

      - name: Install web dependencies
        if: needs.detect-affected.outputs.web_affected == 'true'
        working-directory: apps/web/Web.Solventa.Angular
        run: npm ci

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Run affected lint and build
        run: npx nx affected -t lint build

  backend-tests:
    needs: detect-affected
    if: needs.detect-affected.outputs.backend_affected == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install backend dependencies
        working-directory: apps/backend
        run: poetry install --no-interaction

      - name: Run backend tests with coverage
        run: npx nx run backend:test

      - name: Verificar reportes generados
        if: always()
        working-directory: apps/backend
        run: |
          echo "=== VERIFICANDO REPORTES GENERADOS ==="
          ls -l coverage.xml || echo "❌ coverage.xml no generado"
          ls -l test-results.xml || echo "❌ test-results.xml no generado"
          if [ -f "coverage.xml" ]; then
            echo "✅ coverage.xml generado correctamente"
            head -5 coverage.xml
          fi
          if [ -f "test-results.xml" ]; then
            echo "✅ test-results.xml generado correctamente"
            head -5 test-results.xml
          fi

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            apps/backend/coverage.xml
            apps/backend/test-results.xml

  mobile-tests:
    needs: detect-affected
    if: needs.detect-affected.outputs.mobile_affected == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck Mobile
        run: npm run typecheck-mobile

      - name: Run mobile tests with coverage
        run: npx nx run mobile:test --configuration=ci

      - name: Verificar coverage de Mobile
        if: always()
        run: |
          if [ ! -f "apps/mobile/coverage/lcov.info" ]; then
            echo "❌ apps/mobile/coverage/lcov.info no generado"
            exit 1
          fi
          echo "✅ apps/mobile/coverage/lcov.info generado correctamente"

      - name: Publicar reportes de pruebas de Mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports
          path: apps/mobile/coverage/

  sonarless-mobile:
    name: mobile-sonar
    needs: mobile-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Instalar herramientas de diagnóstico
        run: sudo apt-get update && sudo apt-get install -y jq curl bc

      - name: Descargar reportes de pruebas de Mobile
        uses: actions/download-artifact@v4
        with:
          name: mobile-test-reports
          path: apps/mobile/coverage

      - name: Verificar lcov de Mobile
        run: bash .github/scripts/sonarless-mobile.sh verify-lcov

      - name: Configurar análisis Sonar Mobile
        run: bash .github/scripts/sonarless-mobile.sh configure

      - name: Sonarless Scan
        uses: gitricko/sonarless@v1.3
        id: sonarless-scan
        with:
          sonar-source-path: "apps/mobile/src"
          sonar-project-key: "solventa-mobile"
          sonar-project-name: "Solventa-Mobile"
          sonar-metrics-path: "sonar-metrics-mobile.json"

      - name: Mostrar baseline Sonar Mobile
        run: bash .github/scripts/sonarless-mobile.sh show-baseline

      - name: Mostrar issues y hotspots Sonar Mobile
        run: bash .github/scripts/sonarless-mobile.sh show-issues

      - name: Enforce Mobile Quality Gate
        run: bash .github/scripts/sonarless-mobile.sh enforce-gate

      - name: Publicar métricas Sonar Mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-sonar-metrics
          path: |
            sonar-metrics-mobile.json
            sonar-issues-mobile.json
            sonar-hotspots-mobile.json
          if-no-files-found: warn

  web-tests:
    needs: detect-affected
    if: needs.detect-affected.outputs.web_affected == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web/Web.Solventa.Angular
        run: npm ci

      - name: Run web tests with coverage
        run: npx nx run web.solventa.angular:test --configuration=ci

      - name: Verificar coverage de Web
        if: always()
        run: |
          if [ ! -f "apps/web/Web.Solventa.Angular/coverage/Web.Solventa.Angular/lcov.info" ]; then
            echo "❌ apps/web/Web.Solventa.Angular/coverage/Web.Solventa.Angular/lcov.info no generado"
            exit 1
          fi
          echo "✅ apps/web/Web.Solventa.Angular/coverage/Web.Solventa.Angular/lcov.info generado correctamente"

      - name: Publicar reportes de pruebas de Web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-reports
          path: apps/web/Web.Solventa.Angular/coverage/

  sonarless-web:
    name: web-sonar
    needs: web-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Instalar herramientas de diagnóstico
        run: sudo apt-get update && sudo apt-get install -y jq curl bc

      - name: Descargar reportes de pruebas de Web
        uses: actions/download-artifact@v4
        with:
          name: web-test-reports
          path: apps/web/Web.Solventa.Angular/coverage

      - name: Verificar lcov de Web
        run: bash .github/scripts/sonarless-web.sh verify-lcov

      - name: Normalizar y validar rutas LCOV de Web
        run: bash .github/scripts/sonarless-web.sh normalize-lcov

      - name: Configurar análisis Sonar Web
        run: bash .github/scripts/sonarless-web.sh configure

      - name: Sonarless Scan
        uses: gitricko/sonarless@v1.3
        id: sonarless-scan
        with:
          sonar-source-path: "apps/web/Web.Solventa.Angular/src"
          sonar-project-key: "solventa-web"
          sonar-project-name: "Solventa-Web"
          sonar-metrics-path: "sonar-metrics-web.json"

      - name: Mostrar baseline Sonar Web
        run: bash .github/scripts/sonarless-web.sh show-baseline

      - name: Mostrar issues y hotspots Sonar Web
        run: bash .github/scripts/sonarless-web.sh show-issues

      - name: Enforce Web Quality Gate
        run: bash .github/scripts/sonarless-web.sh enforce-gate

      - name: Publicar métricas Sonar Web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-sonar-metrics
          path: |
            sonar-metrics-web.json
            sonar-issues-web.json
            sonar-hotspots-web.json
          if-no-files-found: warn

  sonarless-backend:
    name: backend-sonar
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Instalar herramientas de diagnóstico
        run: sudo apt-get update && sudo apt-get install -y jq curl bc

      - name: Descargar reportes de pruebas
        uses: actions/download-artifact@v4
        with:
          name: backend-test-reports
          path: apps/backend

      - name: Verificar ubicación de coverage.xml y test-results.xml
        run: bash .github/scripts/sonarless-backend.sh verify-reports

      - name: Sonarless Scan
        uses: gitricko/sonarless@v1.3
        id: sonarless-scan
        with:
          sonar-source-path: "apps/backend"
          sonar-project-key: "solventa-backend"
          sonar-project-name: "Solventa-Backend"
          sonar-metrics-path: "sonar-metrics.json"

      - name: Obtener detalles específicos de problemas
        run: bash .github/scripts/sonarless-backend.sh show-issues

      - name: Mostrar métricas de Sonarless
        run: bash .github/scripts/sonarless-backend.sh show-metrics

