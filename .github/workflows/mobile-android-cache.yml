name: Mobile Android Cache

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/android/**
      - apps/mobile/package.json
      - package-lock.json
      - scripts/build-apk.sh
      - .github/actions/setup-android/**
      - .github/actions/setup-node/**
      - .github/workflows/mobile-android-cache.yml
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-cache
  cancel-in-progress: true

jobs:
  warm:
    name: Warm the Android caches
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version-file: .nvmrc

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Prepare Mobile environment
        run: cp apps/mobile/.env.example apps/mobile/.env

      - name: Build APK
        run: ./scripts/build-apk.sh
