name: Setup Android build
description: Installs Java and the Android SDK packages the mobile app needs and caches the SDK packages and Gradle

inputs:
  platform:
    description: Android platform package
    default: android-37.0
  build-tools:
    description: Android build-tools version
    default: 37.0.0
  ndk:
    description: Android NDK version
    default: 27.1.12297006
  cmake:
    description: CMake version from the Android SDK
    default: 3.31.6

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - name: Locate the Android SDK
      id: sdk
      shell: bash
      run: |
        if [ -z "${ANDROID_HOME:-}" ]; then
          echo "::error::This runner has no ANDROID_HOME."
          exit 1
        fi
        echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

    - name: Restore the Android SDK packages
      id: packages
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.sdk.outputs.root }}/platforms/${{ inputs.platform }}
          ${{ steps.sdk.outputs.root }}/build-tools/${{ inputs.build-tools }}
          ${{ steps.sdk.outputs.root }}/ndk/${{ inputs.ndk }}
          ${{ steps.sdk.outputs.root }}/cmake/${{ inputs.cmake }}
        key: android-sdk-${{ runner.os }}-${{ inputs.platform }}-${{ inputs.build-tools }}-${{ inputs.ndk }}-${{ inputs.cmake }}

    - name: Install the Android SDK packages
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        BUILD_TOOLS: ${{ inputs.build-tools }}
        NDK: ${{ inputs.ndk }}
        CMAKE: ${{ inputs.cmake }}
      run: |
        export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
        set +o pipefail
        yes | sdkmanager --licenses >/dev/null || true
        set -o pipefail
        sdkmanager --install \
          "platforms;$PLATFORM" \
          "build-tools;$BUILD_TOOLS" \
          "ndk;$NDK" \
          "cmake;$CMAKE"

    - name: Save the Android SDK packages
      if: steps.packages.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ steps.sdk.outputs.root }}/platforms/${{ inputs.platform }}
          ${{ steps.sdk.outputs.root }}/build-tools/${{ inputs.build-tools }}
          ${{ steps.sdk.outputs.root }}/ndk/${{ inputs.ndk }}
          ${{ steps.sdk.outputs.root }}/cmake/${{ inputs.cmake }}
        key: ${{ steps.packages.outputs.cache-primary-key }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        build-root-directory: apps/mobile/android
