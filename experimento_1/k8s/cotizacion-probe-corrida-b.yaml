apiVersion: apps/v1
kind: Deployment
metadata:
  name: cotizacion
  namespace: solventa
spec:
  template:
    spec:
      containers:
        - name: cotizacion
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
            initialDelaySeconds: 3
