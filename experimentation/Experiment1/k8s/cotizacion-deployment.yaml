apiVersion: apps/v1
kind: Deployment
metadata:
  name: cotizacion
  namespace: solventa
  labels:
    app: cotizacion
    experimento: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cotizacion
  template:
    metadata:
      labels:
        app: cotizacion
        experimento: "1"
    spec:
      containers:
        - name: cotizacion
          image: cotizacion:experimento-1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
            successThreshold: 1
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
