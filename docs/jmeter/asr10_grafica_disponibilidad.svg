<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="roseGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fb7185"/>
            <stop offset="100%" stop-color="#e11d48"/>
        </linearGradient>
        <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <linearGradient id="violetGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>
    
    <!-- Header -->
    <rect x="30" y="25" width="840" height="70" rx="12" fill="#1e293b" filter="url(#shadow)"/>
    <text x="50" y="55" fill="#f8fafc" font-size="20" font-weight="bold">ASR-10: Disponibilidad del Flujo de Venta ante Degradación de Proveedor</text>
    <text x="50" y="78" fill="#94a3b8" font-size="14">Prueba de Carga en Apache JMeter: 1.000 peticiones continuas (50 hilos concurrentes)</text>
    <rect x="710" y="40" width="140" height="40" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="780" y="65" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">✓ 100.0% DISP.</text>

    <!-- Chart Body -->
    <rect x="30" y="110" width="840" height="380" rx="12" fill="#1e293b" filter="url(#shadow)"/>

    <!-- Left side: Bar comparison -->
    <!-- Scale: 90% to 100% -> range 10%, height 240px (24px per 1%). y0=400 (90%), y100=160 (100%) -->
    <line x1="90" y1="400" x2="520" y2="400" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="340" x2="520" y2="340" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="90" y1="280" x2="520" y2="280" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="90" y1="220" x2="520" y2="220" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="90" y1="160" x2="520" y2="160" stroke="#334155" stroke-dasharray="4,4"/>

    <text x="80" y="405" fill="#64748b" font-size="12" text-anchor="end">90.0%</text>
    <text x="80" y="345" fill="#64748b" font-size="12" text-anchor="end">92.5%</text>
    <text x="80" y="285" fill="#64748b" font-size="12" text-anchor="end">95.0%</text>
    <text x="80" y="225" fill="#64748b" font-size="12" text-anchor="end">97.5%</text>
    <text x="80" y="165" fill="#64748b" font-size="12" text-anchor="end">100.0%</text>

    <!-- Bar 1: Meta 99.9% -> height = 9.9 * 24 = 237.6px, y = 400 - 237.6 = 162.4 -->
    <rect x="150" y="162.4" width="130" height="237.6" rx="6" fill="url(#blueGrad)"/>
    <text x="215" y="152" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">99.90%</text>
    <text x="215" y="425" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Meta ASR-10</text>
    <text x="215" y="442" fill="#94a3b8" font-size="11" text-anchor="middle">(Error &lt; 0.1%)</text>

    <!-- Bar 2: Real 100.0% -> height = 10.0 * 24 = 240px, y = 160 -->
    <rect x="340" y="160" width="130" height="240" rx="6" fill="url(#emeraldGrad)"/>
    <text x="405" y="150" fill="#34d399" font-size="18" font-weight="bold" text-anchor="middle">100.00%</text>
    <text x="405" y="425" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Resultado Real</text>
    <text x="405" y="442" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">(0 Errores / 1000)</text>

    <!-- Right Side: KPI Cards -->
    <g transform="translate(560, 140)">
        <rect x="0" y="0" width="280" height="90" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
        <text x="20" y="32" fill="#94a3b8" font-size="13" font-weight="600">SOLICITUDES EXITOSAS</text>
        <text x="20" y="68" fill="#34d399" font-size="28" font-weight="bold">1.000 / 1.000</text>
        <text x="210" y="65" fill="#34d399" font-size="14" font-weight="bold">100.0%</text>
    </g>

    <g transform="translate(560, 245)">
        <rect x="0" y="0" width="280" height="90" rx="10" fill="#0f172a" stroke="#e11d48" stroke-width="1.5"/>
        <text x="20" y="32" fill="#94a3b8" font-size="13" font-weight="600">TASA DE ERROR HTTP</text>
        <text x="20" y="68" fill="#f87171" font-size="28" font-weight="bold">0.00%</text>
        <text x="200" y="65" fill="#38bdf8" font-size="13">0 caídas</text>
    </g>

    <g transform="translate(560, 350)">
        <rect x="0" y="0" width="280" height="75" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="30" fill="#94a3b8" font-size="13" font-weight="600">THROUGHPUT SOSTENIDO</text>
        <text x="20" y="60" fill="#38bdf8" font-size="24" font-weight="bold">98.8 req/seg</text>
        <text x="180" y="58" fill="#94a3b8" font-size="12">10 seg ráfaga</text>
    </g>

    <rect x="50" y="455" width="480" height="24" rx="6" fill="#0f172a"/>
    <text x="290" y="471" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">✓ Ninguna solicitud fue abortada gracias al modo degradado gracioso</text>
    
</svg>