<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="roseGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fb7185"/>
            <stop offset="100%" stop-color="#e11d48"/>
        </linearGradient>
        <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <linearGradient id="violetGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>
    
    <!-- Header -->
    <rect x="30" y="25" width="840" height="70" rx="12" fill="#1e293b" filter="url(#shadow)"/>
    <text x="50" y="55" fill="#f8fafc" font-size="20" font-weight="bold">ASR-02: Latencia de Perfilamiento Vida Hipotecario</text>
    <text x="50" y="78" fill="#94a3b8" font-size="14">Prueba de Carga en Apache JMeter (600 muestras concurrentes, 30 hilos) - Meta p95 ≤ 400 ms</text>
    <rect x="710" y="40" width="140" height="40" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="780" y="65" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">✓ CUMPLIDO</text>

    <!-- Chart Body -->
    <rect x="30" y="110" width="840" height="380" rx="12" fill="#1e293b" filter="url(#shadow)"/>
    
    <!-- Grid lines -->
    <line x1="100" y1="420" x2="820" y2="420" stroke="#334155" stroke-width="1.5"/>
    <line x1="100" y1="340" x2="820" y2="340" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="100" y1="260" x2="820" y2="260" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="100" y1="180" x2="820" y2="180" stroke="#334155" stroke-dasharray="4,4"/>
    
    <!-- Y-axis labels -->
    <text x="85" y="425" fill="#64748b" font-size="12" text-anchor="end">0 ms</text>
    <text x="85" y="345" fill="#64748b" font-size="12" text-anchor="end">100 ms</text>
    <text x="85" y="265" fill="#64748b" font-size="12" text-anchor="end">200 ms</text>
    <text x="85" y="185" fill="#64748b" font-size="12" text-anchor="end">300 ms</text>
    <text x="85" y="145" fill="#64748b" font-size="12" text-anchor="end">400 ms</text>

    <!-- Threshold Reference Line 400 ms -->
    <line x1="100" y1="140" x2="820" y2="140" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="810" y="132" fill="#f87171" font-size="13" font-weight="bold" text-anchor="end">Límite ASR-02 (400 ms)</text>

    <!-- Bar 1: Medido p95 (26ms) -> height = 26 * 0.7 = 18.2px, y = 420 - 18.2 = 401.8 -->
    <!-- Scale: 400ms = 280px (0.7 px/ms) -->
    <rect x="230" y="401.8" width="160" height="18.2" rx="6" fill="url(#emeraldGrad)"/>
    <!-- Label atop bar 1 -->
    <rect x="240" y="340" width="140" height="48" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="310" y="362" fill="#34d399" font-size="20" font-weight="bold" text-anchor="middle">26 ms</text>
    <text x="310" y="380" fill="#94a3b8" font-size="11" text-anchor="middle">Medido p95 en JMeter</text>
    <path d="M 310 388 L 310 398" stroke="#34d399" stroke-width="2"/>

    <!-- Bar 2: Limite Maximo (400ms) -> height = 280px, y = 140 -->
    <rect x="530" y="140" width="160" height="280" rx="6" fill="url(#roseGrad)" opacity="0.85"/>
    <!-- Label atop bar 2 -->
    <rect x="540" y="155" width="140" height="48" rx="8" fill="#0f172a" stroke="#e11d48" stroke-width="1.5"/>
    <text x="610" y="177" fill="#fb7185" font-size="20" font-weight="bold" text-anchor="middle">400 ms</text>
    <text x="610" y="195" fill="#94a3b8" font-size="11" text-anchor="middle">Techo Máximo Tolerado</text>

    <!-- X-axis Labels -->
    <text x="310" y="445" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Percentil 95 (Medido Real)</text>
    <text x="610" y="445" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Límite Contractual ASR-02</text>

    <!-- Callout Box -->
    <rect x="180" y="465" width="560" height="20" rx="6" fill="#0f172a"/>
    <text x="460" y="480" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">⚡ Margen de Seguridad: 15.4x más veloz que la meta | Consumo de sólo 6.5% del presupuesto</text>
    
</svg>