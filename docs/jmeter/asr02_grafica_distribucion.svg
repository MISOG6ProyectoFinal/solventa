<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="roseGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fb7185"/>
            <stop offset="100%" stop-color="#e11d48"/>
        </linearGradient>
        <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <linearGradient id="violetGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>
    
    <!-- Header -->
    <rect x="30" y="25" width="840" height="70" rx="12" fill="#1e293b" filter="url(#shadow)"/>
    <text x="50" y="55" fill="#f8fafc" font-size="20" font-weight="bold">ASR-02: Curva de Distribución de Latencias en Carga Concurrente</text>
    <text x="50" y="78" fill="#94a3b8" font-size="14">Resultados Empíricos JMeter: 600 solicitudes, Throughput: 115.5 req/s, Error: 0.00%</text>

    <!-- Chart Body -->
    <rect x="30" y="110" width="840" height="380" rx="12" fill="#1e293b" filter="url(#shadow)"/>
    
    <!-- Grid lines (0, 20, 40, 60, 80 ms) -->
    <line x1="90" y1="400" x2="810" y2="400" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="340" x2="810" y2="340" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="90" y1="280" x2="810" y2="280" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="90" y1="220" x2="810" y2="220" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="90" y1="160" x2="810" y2="160" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- Y labels -->
    <text x="75" y="405" fill="#64748b" font-size="12" text-anchor="end">0 ms</text>
    <text x="75" y="345" fill="#64748b" font-size="12" text-anchor="end">20 ms</text>
    <text x="75" y="285" fill="#64748b" font-size="12" text-anchor="end">40 ms</text>
    <text x="75" y="225" fill="#64748b" font-size="12" text-anchor="end">60 ms</text>
    <text x="75" y="165" fill="#64748b" font-size="12" text-anchor="end">80 ms</text>

    <!-- Bars & Line -->
    
        <rect x="140" y="355.0" width="60" height="45.0" rx="5" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="170" y="345.0" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">15 ms</text>
        <text x="170" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Mínimo</text>
        
        <rect x="230" y="340.0" width="60" height="60.0" rx="5" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="260" y="330.0" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">20 ms</text>
        <text x="260" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Mediana</text>
        
        <rect x="320" y="337.0" width="60" height="63.0" rx="5" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="350" y="327.0" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">21 ms</text>
        <text x="350" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Promedio</text>
        
        <rect x="410" y="328.0" width="60" height="72.0" rx="5" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="440" y="318.0" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">24 ms</text>
        <text x="440" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">p90</text>
        
        <rect x="500" y="322.0" width="60" height="78.0" rx="5" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="530" y="312.0" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">26 ms</text>
        <text x="530" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">p95</text>
        
        <rect x="590" y="271.0" width="60" height="129.0" rx="5" fill="url(#amberGrad)" filter="url(#shadow)"/>
        <text x="620" y="261.0" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">43 ms</text>
        <text x="620" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">p99</text>
        
        <rect x="680" y="163.0" width="60" height="237.0" rx="5" fill="url(#roseGrad)" filter="url(#shadow)"/>
        <text x="710" y="153.0" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">79 ms</text>
        <text x="710" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Máximo</text>
        
    <polyline points="170,355.0 260,340.0 350,337.0 440,328.0 530,322.0 620,271.0 710,163.0" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="170" cy="355.0" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="260" cy="340.0" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="350" cy="337.0" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="440" cy="328.0" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="530" cy="322.0" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="620" cy="271.0" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="710" cy="163.0" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

    <!-- Callout Box -->
    <rect x="70" y="450" width="760" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="450" y="469" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">✓ El 95% de las transacciones se resuelven en ≤ 26 ms con una Desviación Estándar de apenas 5.20 ms</text>
    
</svg>