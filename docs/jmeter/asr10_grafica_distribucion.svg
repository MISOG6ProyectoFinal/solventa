<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="roseGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fb7185"/>
            <stop offset="100%" stop-color="#e11d48"/>
        </linearGradient>
        <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <linearGradient id="violetGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>
    
    <!-- Header -->
    <rect x="30" y="25" width="840" height="70" rx="12" fill="#1e293b" filter="url(#shadow)"/>
    <text x="50" y="55" fill="#f8fafc" font-size="20" font-weight="bold">ASR-10: Curva de Latencias en JMeter bajo Modo Degradado</text>
    <text x="50" y="78" fill="#94a3b8" font-size="14">1.000 solicitudes continuas, Desviación Estándar = 3.03 ms, Throughput = 98.8 req/s</text>

    <!-- Chart Body -->
    <rect x="30" y="110" width="840" height="380" rx="12" fill="#1e293b" filter="url(#shadow)"/>
    
    <!-- Grid lines (0, 20, 40, 60 ms) -->
    <line x1="90" y1="400" x2="810" y2="400" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="323" x2="810" y2="323" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="90" y1="246" x2="810" y2="246" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="90" y1="169" x2="810" y2="169" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- Y labels -->
    <text x="75" y="405" fill="#64748b" font-size="12" text-anchor="end">0 ms</text>
    <text x="75" y="328" fill="#64748b" font-size="12" text-anchor="end">20 ms</text>
    <text x="75" y="251" fill="#64748b" font-size="12" text-anchor="end">40 ms</text>
    <text x="75" y="174" fill="#64748b" font-size="12" text-anchor="end">60 ms</text>

    <!-- Bars & Line -->
    
        <rect x="140" y="349.95" width="60" height="50.050000000000004" rx="5" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="170" y="339.95" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">13 ms</text>
        <text x="170" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Mínimo</text>
        
        <rect x="230" y="326.85" width="60" height="73.15" rx="5" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="260" y="316.85" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">19 ms</text>
        <text x="260" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Mediana</text>
        
        <rect x="320" y="326.85" width="60" height="73.15" rx="5" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="350" y="316.85" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">19 ms</text>
        <text x="350" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Promedio</text>
        
        <rect x="410" y="315.3" width="60" height="84.7" rx="5" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="440" y="305.3" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">22 ms</text>
        <text x="440" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">p90</text>
        
        <rect x="500" y="315.3" width="60" height="84.7" rx="5" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
        <text x="530" y="305.3" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">22 ms</text>
        <text x="530" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">p95</text>
        
        <rect x="590" y="288.35" width="60" height="111.65" rx="5" fill="url(#amberGrad)" filter="url(#shadow)"/>
        <text x="620" y="278.35" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">29 ms</text>
        <text x="620" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">p99</text>
        
        <rect x="680" y="172.85" width="60" height="227.15" rx="5" fill="url(#roseGrad)" filter="url(#shadow)"/>
        <text x="710" y="162.85" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">59 ms</text>
        <text x="710" y="425" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Máximo</text>
        
    <polyline points="170,349.95 260,326.85 350,326.85 440,315.3 530,315.3 620,288.35 710,172.85" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="170" cy="349.95" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="260" cy="326.85" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="350" cy="326.85" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="440" cy="315.3" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="530" cy="315.3" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="620" cy="288.35" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/><circle cx="710" cy="172.85" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

    <!-- Callout Box -->
    <rect x="70" y="450" width="760" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="450" y="469" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">✓ Máxima estabilidad: Desviación estándar de 3.03 ms con 50 hilos concurrentes</text>
    
