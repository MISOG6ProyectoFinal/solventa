@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40" (click)="closed.emit()"></div>
    <div
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      class="relative bg-white rounded-2xl border border-border shadow-xl w-full max-h-[90vh] overflow-auto"
      [class]="wide() ? 'max-w-2xl' : 'max-w-lg'"
    >
      <div class="flex items-center justify-between px-5 py-4 border-b border-border">
        <h3 class="text-lg font-semibold font-serif text-foreground">{{ title() }}</h3>
        <button
          type="button"
          aria-label="Cerrar"
          (click)="closed.emit()"
          class="w-8 h-8 rounded-lg text-sm font-medium text-muted-foreground hover:bg-muted cursor-pointer"
        >
          ✕
        </button>
      </div>
      <div class="p-5"><ng-content /></div>
      <div class="px-5 py-4 border-t border-border flex justify-end gap-4 empty:hidden">
        <ng-content select="[slot=footer]" />
      </div>
    </div>
  </div>
}
