<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.5"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.role]="title() ? 'img' : null"
  [attr.aria-label]="title() || null"
  [attr.aria-hidden]="title() ? null : true"
>
  @for (shape of shapes(); track $index) {
    @switch (shape.t) {
      @case ('path') {
        <svg:path [attr.d]="shape.d" />
      }
      @case ('circle') {
        <svg:circle [attr.cx]="shape.cx" [attr.cy]="shape.cy" [attr.r]="shape.r" />
      }
      @case ('rect') {
        <svg:rect [attr.x]="shape.x" [attr.y]="shape.y" [attr.width]="shape.w" [attr.height]="shape.h" [attr.rx]="shape.rx" />
      }
    }
  }
</svg>
