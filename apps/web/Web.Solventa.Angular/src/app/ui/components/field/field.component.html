<label class="text-sm font-medium block text-foreground">
  {{ label() }}
  @if (required()) {
    <span class="text-error"> *</span>
  }
</label>
<ng-content />
@if (error(); as err) {
  <p class="text-xs font-medium text-error">{{ err }}</p>
} @else if (hint(); as h) {
  <p class="text-xs text-muted-foreground">{{ h }}</p>
}
