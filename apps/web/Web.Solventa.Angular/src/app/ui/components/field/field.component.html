<label class="text-xs font-medium uppercase tracking-wider block text-muted-foreground">
  {{ label() }}
  @if (required()) {
    <span class="text-error"> *</span>
  }
</label>
<ng-content />
@if (error(); as err) {
  <p class="text-[11px] font-medium text-error">{{ err }}</p>
} @else if (hint(); as h) {
  <p class="text-[11px] text-muted-foreground">{{ h }}</p>
}
