<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4 mb-2">
    <div>
      <div class="flex items-center gap-3">
        <div class="w-1 h-8 rounded-full bg-accent"></div>
        <h1 class="text-2xl font-semibold text-foreground font-['Fraunces']">{{ locale.t('partners.title') }}</h1>
      </div>
      <p class="text-sm text-muted-foreground mt-1 ml-4 pl-1">{{ locale.t('partners.subtitle') }}</p>
    </div>
    <div class="flex gap-2">
      <button slv-button variant="primary" (click)="showCreateModal.set(true)">{{ locale.t('partners.new') }}</button>
    </div>
  </div>

  @if (loadError()) {
    <slv-alert tone="error">
      {{ locale.t('partners.loadError') }}
      <button type="button" class="underline font-medium cursor-pointer" (click)="reload()">{{ locale.t('partners.retry') }}</button>
    </slv-alert>
  }

  @if (loading()) {
    <output class="block text-sm text-muted-foreground">{{ locale.t('partners.loading') }}</output>
  } @else if (!selectedPartner()) {
    <slv-partner-list 
      [partners]="partners()"
      (opened)="openPartner($event)"
    />
  } @else {
    <slv-partner-detail 
      [partner]="selectedPartner()!"
      (backRequested)="closePartner()"
    />
  }

  <slv-create-partner-modal 
    [open]="showCreateModal()"
    (closed)="showCreateModal.set(false)"
    (created)="onPartnerCreated($event)"
  />
</div>
