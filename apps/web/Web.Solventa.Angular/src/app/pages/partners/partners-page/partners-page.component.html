<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4 mb-2">
    <div>
      <div class="flex items-center gap-3">
        <div class="w-1 h-8 rounded-full bg-accent"></div>
        <h1 class="text-2xl font-semibold text-foreground font-['Fraunces']">Socios e Integraciones</h1>
      </div>
      <p class="text-sm text-muted-foreground mt-1 ml-4 pl-1">Canal embebido · Alta de socios, configuración de ramos y operaciones del canal</p>
    </div>
    <div class="flex gap-2">
      <button slv-button variant="primary" (click)="showCreateModal.set(true)">Nuevo socio</button>
    </div>
  </div>

  @if (loadError()) {
    <slv-alert tone="error">
      No fue posible cargar los socios.
      <button type="button" class="underline font-medium cursor-pointer" (click)="reload()">Reintentar</button>
    </slv-alert>
  }

  @if (loading()) {
    <p class="text-sm text-muted-foreground" role="status">Cargando socios…</p>
  } @else if (!selectedPartner()) {
    <slv-partner-list 
      [partners]="partners()"
      (opened)="openPartner($event)"
    />
  } @else {
    <slv-partner-detail 
      [partner]="selectedPartner()!"
      (backRequested)="closePartner()"
      (updateRequested)="onPartnerUpdated($event)"
    />
  }

  <slv-create-partner-modal 
    [open]="showCreateModal()"
    (closed)="showCreateModal.set(false)"
    (created)="onPartnerCreated($event)"
  />
</div>
