<slv-modal [open]="true" [title]="locale.t('endorsement.title')" [wide]="true" (closed)="closed.emit()">
  <div class="space-y-4">
    <slv-alert tone="info">{{ locale.t('endorsement.info') }}</slv-alert>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <slv-field [label]="locale.t('endorsement.type')" [required]="true">
        <select slvInput [(ngModel)]="type">
          @for (option of types; track option.id) {
            <option [value]="option.id">{{ locale.t(option.labelKey) }}</option>
          }
        </select>
      </slv-field>

      <slv-field [label]="locale.t('endorsement.date')" [required]="true" [error]="dateError()">
        <input slvInput type="date" [invalid]="!!dateError()" [(ngModel)]="effectiveDate" />
      </slv-field>

      <slv-field [label]="locale.t('endorsement.phone')">
        <input slvInput type="text" [(ngModel)]="phone" />
      </slv-field>

      <slv-field [label]="locale.t('endorsement.email')">
        <input slvInput type="email" [(ngModel)]="email" />
      </slv-field>
    </div>

    <slv-field [label]="locale.t('endorsement.address')">
      <input slvInput type="text" [(ngModel)]="address" />
    </slv-field>

    <slv-field [label]="locale.t('endorsement.reason')" [required]="true" [error]="reasonError()">
      <input
        slvInput
        type="text"
        [placeholder]="locale.t('endorsement.reasonPlaceholder')"
        [invalid]="!!reasonError()"
        [(ngModel)]="reason"
      />
    </slv-field>
  </div>

  <button slot="footer" slv-button type="button" variant="outline" (click)="closed.emit()">{{ locale.t('common.cancel') }}</button>
  <button slot="footer" slv-button type="button" variant="primary" (click)="submit()">{{ locale.t('common.continue') }}</button>
</slv-modal>
