<slv-card>
  <h2 class="text-base font-semibold mb-4 text-foreground">{{ locale.t('quote.form.title') }}</h2>

  <slv-field [label]="locale.t('quote.form.ramo')" [required]="true">
    <select slvInput [ngModel]="ramo()" (ngModelChange)="changeRamo($event)">
      @for (item of ramos(); track item.id) {
        <option [value]="item.id">{{ locale.label('ramo', item.id, item.name) }}{{ item.requiresConsent ? locale.t('quote.form.requiresConsent') : '' }}</option>
      }
    </select>
  </slv-field>

  <p class="text-sm font-medium mt-6 mb-3 pt-5 border-t border-border text-muted-foreground">{{ locale.t('quote.form.client') }}</p>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    @for (field of clientFields(); track field.key) {
      <slv-quote-field
        [definition]="field"
        [value]="valueOf(field.key)"
        [error]="errorOf(field.key)"
        (valueChange)="setValue(field.key, $event)"
      />
    }
  </div>

  <p class="text-sm font-medium mt-6 mb-3 pt-5 border-t border-border text-muted-foreground">
    {{ locale.t('quote.form.risk', { ramo: locale.label('ramo', ramo()) }) }}
  </p>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    @for (field of riskFields(); track field.key) {
      <slv-quote-field
        [definition]="field"
        [value]="valueOf(field.key)"
        [error]="errorOf(field.key)"
        (valueChange)="setValue(field.key, $event)"
      />
    }
  </div>
</slv-card>
