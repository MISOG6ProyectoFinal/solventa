<div class="grid grid-cols-1 xl:grid-cols-5 gap-6">
  <div class="xl:col-span-3 space-y-5">
    @if (catalogFailed()) {
      <slv-alert tone="error">{{ locale.t('quote.catalogError') }}</slv-alert>
    }

    @if (!canQuote()) {
      <slv-alert tone="info">{{ locale.t('quote.readOnly') }}</slv-alert>
    }

    <slv-quote-form
      #quoteForm
      [(ramo)]="ramo"
      [ramos]="ramos()"
      [contract]="contract()"
      [documentTypes]="documentTypes()"
      (formChange)="formValues.set($event)"
      (quoteReady)="onQuoteReady($event)"
    />

    <slv-consent-panel
      [required]="requiresConsent()"
      [ramoLabel]="ramoLabel()"
      [ramoId]="ramo()"
      [celular]="
        formValues()['telefono'] ||
        formValues()['celular'] ||
        quoteForm.valueOf('telefono') ||
        quoteForm.valueOf('celular')
      "
      [correo]="
        formValues()['email'] ||
        formValues()['correo'] ||
        quoteForm.valueOf('email') ||
        quoteForm.valueOf('correo')
      "
      [documento]="formValues()['numeroDocumento'] || quoteForm.valueOf('numeroDocumento')"
      [tipoDocumento]="formValues()['tipoDocumento'] || quoteForm.valueOf('tipoDocumento')"
      [nombre]="formValues()['nombre'] || quoteForm.valueOf('nombre')"
      [apellido]="formValues()['apellido'] || quoteForm.valueOf('apellido')"
      [fechaNacimiento]="formValues()['fechaNacimiento'] || quoteForm.valueOf('fechaNacimiento')"
      [readOnly]="!canQuote()"
      (consentValidated)="onConsentValidated($event)"
    />

    <slv-card>
      <slv-field [label]="locale.t('quote.simulation')" [hint]="locale.t('quote.simulationHint')" [error]="simulatorError() ? locale.t('quote.simulationError') : ''">
        <select slvInput [ngModel]="scenario()" (ngModelChange)="changeScenario($event)">
          @for (option of scenarios; track option.id) {
            <option [value]="option.id">{{ locale.t(option.labelKey) }}</option>
          }
        </select>
      </slv-field>
    </slv-card>

    <div class="flex justify-end">
      <button
        slv-button
        type="button"
        [disabled]="isCalculating() || !puedeCalcular()"
        (click)="quoteForm.submit()"
      >
        {{ isCalculating() ? locale.t('quote.calculating') : locale.t('quote.calculate') }}
      </button>
    </div>
  </div>

  <div class="xl:col-span-2">
    <slv-quote-breakdown
      [isCalculating]="isCalculating()"
      [quoteResult]="quoteResult()"
      [errorMessage]="errorMessage()"
      [requiresConsent]="requiresConsent()"
      [consentValidated]="consentValidated()"
      [ramoLabel]="ramoLabel()"
    />
  </div>
</div>
