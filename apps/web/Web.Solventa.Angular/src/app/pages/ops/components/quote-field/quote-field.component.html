<slv-field [label]="label()" [required]="definition().required" [error]="error()">
  @if (definition().type === 'select') {
    <select slvInput [invalid]="!!error()" [(ngModel)]="value">
      <option value="">{{ locale.t('common.select') }}</option>
      @for (option of definition().options; track option) {
        <option [value]="option">{{ locale.label('quote.option', option) }}</option>
      }
    </select>
  } @else {
    <input
      slvInput
      [invalid]="!!error()"
      [type]="definition().type"
      [placeholder]="definition().placeholder ?? ''"
      [(ngModel)]="value"
      (keydown)="blockNonNumeric($event)"
    />
  }
</slv-field>
