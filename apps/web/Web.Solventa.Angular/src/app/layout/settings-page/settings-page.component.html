<div class="space-y-6" data-testid="settings-page">
  <div class="flex items-center gap-3">
    <a routerLink="/ops" data-testid="settings-back" class="text-sm font-medium hover:underline text-secondary">
      ← {{ locale.t('settings.back') }}
    </a>
  </div>

  <slv-page-header [title]="locale.t('settings.title')" />

  <div class="grid grid-cols-1 md:grid-cols-[220px_1fr] gap-6">
    <aside class="space-y-1">
      <button
        type="button"
        data-testid="settings-nav-language"
        class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors bg-primary text-white"
      >
        {{ locale.t('settings.language') }}
      </button>
    </aside>

    <slv-card data-testid="settings-language-panel">
      <div class="space-y-4 max-w-md">
        <div>
          <h2 class="text-sm font-semibold text-foreground font-sans">{{ locale.t('settings.language') }}</h2>
          <p class="text-sm mt-1 text-muted-foreground">{{ locale.t('settings.languageDesc') }}</p>
        </div>
        <slv-field [label]="locale.t('settings.languageLabel')">
          <select
            slvInput
            data-testid="settings-language-select"
            [value]="locale.locale()"
            (change)="onLocaleChange($event)"
          >
            <option value="es">{{ locale.t('settings.language.es') }}</option>
            <option value="en">{{ locale.t('settings.language.en') }}</option>
          </select>
        </slv-field>
      </div>
    </slv-card>
  </div>
</div>
