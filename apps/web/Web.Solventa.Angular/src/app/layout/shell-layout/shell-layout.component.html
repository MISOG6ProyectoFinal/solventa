<div class="min-h-screen flex flex-col bg-background">
  <header class="h-14 flex items-center justify-between px-6 bg-white border-b border-border sticky top-0 z-40">
    <div class="flex items-center gap-4">
      <button
        type="button"
        data-testid="web-toggle-sidebar"
        (click)="layout.toggleSidebar()"
        class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-muted transition-colors text-foreground cursor-pointer"
      >
        <slv-icon name="menu" [size]="20" [title]="locale.t('web.header.menu')" />
      </button>
      <slv-logo />
    </div>

    <div class="flex items-center gap-3">
      <button
        type="button"
        data-testid="web-notificaciones"
        class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-muted transition-colors relative text-foreground cursor-pointer"
      >
        <slv-icon name="notificacion" [size]="20" [title]="locale.t('web.header.notifications')" />
      </button>

      <a
        routerLink="/"
        data-testid="web-volver-landing"
        class="inline-flex items-center gap-1 text-xs font-medium text-muted-foreground hover:text-foreground transition-colors"
      >
        <slv-icon name="volver" [size]="16" />
        {{ locale.t('web.header.back') }}
      </a>

      <div class="relative" #profile>
        <button
          type="button"
          data-testid="web-profile-menu"
          [attr.aria-label]="locale.t('web.profile.menu')"
          [attr.aria-expanded]="layout.profileOpen()"
          (click)="layout.toggleProfile()"
          class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-xs text-white font-semibold hover:opacity-90 cursor-pointer"
        >
          {{ operatorInitials() }}
        </button>
        @if (layout.profileOpen()) {
          <div
            data-testid="web-profile-dropdown"
            class="absolute right-0 mt-2 w-44 rounded-lg border border-border bg-white shadow-md py-1 z-50"
          >
            <a
              routerLink="/settings"
              data-testid="web-profile-settings"
              (click)="layout.closeProfile()"
              class="block w-full text-left px-4 py-2.5 text-sm font-medium text-foreground hover:bg-muted transition-colors"
            >
              {{ locale.t('web.profile.settings') }}
            </a>
            <button
              type="button"
              data-testid="web-profile-logout"
              (click)="logout()"
              class="block w-full text-left px-4 py-2.5 text-sm font-medium text-foreground hover:bg-muted transition-colors cursor-pointer"
            >
              {{ locale.t('web.profile.logout') }}
            </button>
          </div>
        }
      </div>
    </div>
  </header>

  <div class="flex flex-1">
    @if (showSidebar()) {
      <aside class="w-56 bg-white border-r border-border flex flex-col py-4 shrink-0">
        <nav class="flex-1 px-3 space-y-0.5">
          @for (remote of remotes(); track remote.path) {
            <a
              [routerLink]="'/' + remote.path"
              routerLinkActive
              #rla="routerLinkActive"
              [attr.data-testid]="remote.testId"
              class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-left outline-none focus-visible:ring-2 focus-visible:ring-accent/40"
              [class]="
                rla.isActive
                  ? 'bg-muted text-primary'
                  : 'text-muted-foreground hover:bg-muted hover:text-foreground'
              "
            >
              <slv-icon [name]="remote.icon" [size]="20" />
              {{ locale.t(remote.labelKey) }}
            </a>
          }
        </nav>
        <div class="px-4 pt-4 border-t border-border">
          <div class="text-xs text-muted-foreground font-medium mb-1" data-testid="web-operator-role">{{ roleLabel() }}</div>
          <div class="text-sm font-semibold text-foreground" data-testid="web-operator-name">{{ operator()?.name }}</div>
          <div class="text-xs text-muted-foreground break-all">{{ operator()?.email }}</div>
        </div>
      </aside>
    }

    <main class="flex-1 min-w-0 p-6 md:p-8 overflow-auto">
      <router-outlet />
    </main>
  </div>
</div>
