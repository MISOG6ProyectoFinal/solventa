# Dependencias locales y los servicios del reporte móvil.
# Solo infraestructura: docker compose up -d postgres redis localstack
# Reporte desde el teléfono: docker compose up -d canales
# Portal web (ng serve en http://localhost:4200): docker compose up -d canales
# Canales publica el puerto 8000. Siniestros queda en la red de Compose.
# La URL de carga usa AWS_ENDPOINT_URL (por defecto http://localstack:4566, solo visible
# dentro de Compose). Para que el teléfono suba el archivo, defina en este directorio
# AWS_ENDPOINT_URL=http://<ip-de-la-red>:4566 y vuelva a levantar siniestros.
# Cotización contra PostgreSQL (una vez, antes de uvicorn):
#   cd services/cotizacion && DB_HOST=localhost DB_PORT=5433 DB_NAME=cotizacion DB_USER=solventa \
#     DB_PASSWORD=solventa python -m cotizacion.bootstrap
#   cd services/cotizacion && DB_HOST=localhost DB_PORT=5433 DB_NAME=cotizacion DB_USER=solventa \
#     DB_PASSWORD=solventa uvicorn cotizacion.main:app --reload
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: solventa
      POSTGRES_PASSWORD: solventa
      POSTGRES_DB: solventa
    ports: ["5433:5432"]
    volumes:
      - ./deploy/k8s/components/k3s/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solventa -d solventa"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sns,sqs,s3
    ports: ["4566:4566"]
    volumes:
      - ./deploy/k8s/overlays/local/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "head-bucket", "--bucket", "solventa-evidencias"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  siniestros:
    build: &siniestros-build
      context: .
      args:
        SERVICE: siniestros
    ports: ["8001:8000"]
    environment: &siniestros-db
      SERVICE_NAME: siniestros
      DB_HOST: postgres
      DB_NAME: siniestros
      DB_USER: solventa
      DB_PASSWORD: solventa
      PERSISTENT_STORES: ${PERSISTENT_STORES:-false}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      EVIDENCIAS_BUCKET: ${EVIDENCIAS_BUCKET:-solventa-evidencias}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  # Carga el catálogo de prestadores (seed y OpenStreetMap). Si OpenStreetMap no responde, queda el seed.
  # Una vez: docker compose run --rm siniestros-prestadores-sync
  siniestros-prestadores-sync:
    build: *siniestros-build
    command: ["python", "-m", "siniestros.prestadores.sync"]
    environment: *siniestros-db
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["sync"]
  cotizacion-bootstrap:
    build: &cotizacion-build
      context: .
      args:
        SERVICE: cotizacion
    command: ["python", "-m", "cotizacion.bootstrap"]
    environment: &cotizacion-env
      SERVICE_NAME: cotizacion
      DB_HOST: postgres
      DB_NAME: cotizacion
      DB_USER: solventa
      DB_PASSWORD: solventa
    depends_on:
      postgres:
        condition: service_healthy
  cotizacion:
    build: *cotizacion-build
    environment: *cotizacion-env
    depends_on:
      cotizacion-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  identidad-migrate:
    build: &identidad-build
      context: .
      args:
        SERVICE: identidad
    command: ["python", "-m", "identidad.kyc.migrate"]
    environment: &identidad-db
      SERVICE_NAME: identidad
      DB_HOST: postgres
      DB_NAME: identidad
      DB_USER: solventa
      DB_PASSWORD: solventa
    depends_on:
      postgres:
        condition: service_healthy
  identidad:
    build: *identidad-build
    environment:
      <<: *identidad-db
      SESION_SECRETO: ${SESION_SECRETO:?Defina SESION_SECRETO en el archivo .env de este directorio}
    depends_on:
      identidad-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  pagos:
    build:
      context: .
      args:
        SERVICE: pagos
    environment:
      SERVICE_NAME: pagos
      DB_HOST: postgres
      DB_NAME: pagos
      DB_USER: solventa
      DB_PASSWORD: solventa
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  polizas:
    build:
      context: .
      args:
        SERVICE: polizas
    environment:
      SERVICE_NAME: polizas
      DB_HOST: postgres
      DB_NAME: polizas
      DB_USER: solventa
      DB_PASSWORD: solventa
      COTIZACION_URL: http://cotizacion:8000
      PAGOS_URL: http://pagos:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  canales:
    build:
      context: .
      args:
        SERVICE: canales
    ports: ["8000:8000"]
    environment:
      SERVICE_NAME: canales
      SINIESTROS_URL: http://siniestros:8000
      COTIZACION_URL: http://cotizacion:8000
      IDENTIDAD_URL: http://identidad:8000
      PAGOS_URL: http://pagos:8000
      POLIZAS_URL: http://polizas:8000
      SESION_SECRETO: ${SESION_SECRETO:?Defina SESION_SECRETO en el archivo .env de este directorio}
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      siniestros:
        condition: service_healthy
      cotizacion:
        condition: service_healthy
      identidad:
        condition: service_healthy
      pagos:
        condition: service_started
      polizas:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
