[project]
name = "solventa-common"
version = "0.1.0"
description = "Librería compartida de los microservicios de Solventa: configuración, salud, eventos, idempotencia y resiliencia."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.0,<6.0",
    "boto3>=1.34,<2.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
