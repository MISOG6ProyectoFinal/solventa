# Generado a partir del modelo de componentes VC-003 v2.0. Editar a mano es válido.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers-siniestro-parametrico
  labels:
    app.kubernetes.io/name: workers-siniestro-parametrico
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: workers-siniestro-parametrico
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workers-siniestro-parametrico
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: solventa-backend
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: workers-siniestro-parametrico
      containers:
      - name: workers-siniestro-parametrico
        image: solventa/siniestro-parametrico
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVICE_NAME
          value: workers-siniestro-parametrico
        - name: EVENTS_QUEUE_URL
          valueFrom:
            configMapKeyRef:
              name: solventa-platform
              key: QUEUE_URL_SINIESTRO_PARAMETRICO
        envFrom:
        - configMapRef:
            name: solventa-platform
        - configMapRef:
            name: solventa-services
        - secretRef:
            name: db-siniestros
        resources:
          requests:
            cpu: 250m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 384Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        command:
        - python
        - -m
        - siniestro_parametrico.entrypoints.worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workers-siniestro-parametrico
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workers-siniestro-parametrico
