# Terceros simulados (Open Finance, pasarela, notificaciones). Una réplica: el modo de cada uno vive en memoria.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simuladores
  labels:
    app.kubernetes.io/name: simuladores
    app.kubernetes.io/component: terceros
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simuladores
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simuladores
        app.kubernetes.io/component: terceros
    spec:
      serviceAccountName: solventa-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: simuladores
      containers:
      - name: simuladores
        image: solventa/simuladores:local
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVICE_NAME
          value: simuladores
        envFrom:
        - configMapRef:
            name: solventa-platform
        - configMapRef:
            name: solventa-services
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 256Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: simuladores
  labels:
    app.kubernetes.io/name: simuladores
    app.kubernetes.io/component: terceros
spec:
  selector:
    app.kubernetes.io/name: simuladores
  ports:
  - name: http
    port: 80
    targetPort: http
