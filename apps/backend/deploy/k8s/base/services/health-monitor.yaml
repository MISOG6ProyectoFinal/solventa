# Un servicio por almacén; cada componente de VC-003 v2.0 es un módulo dentro de él. Editar a mano es válido.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
  labels:
    app.kubernetes.io/name: health-monitor
    app.kubernetes.io/component: exposicion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: health-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-monitor
        app.kubernetes.io/component: exposicion
    spec:
      serviceAccountName: solventa-backend
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: health-monitor
      containers:
      - name: health-monitor
        image: solventa/health-monitor
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVICE_NAME
          value: health-monitor
        envFrom:
        - configMapRef:
            name: solventa-platform
        - configMapRef:
            name: solventa-services
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: health-monitor
  labels:
    app.kubernetes.io/name: health-monitor
    app.kubernetes.io/component: exposicion
spec:
  selector:
    app.kubernetes.io/name: health-monitor
  ports:
  - name: http
    port: 80
    targetPort: http
