# Un servicio por almacén; cada componente de VC-003 v2.0 es un módulo dentro de él. Editar a mano es válido.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polizas
  labels:
    app.kubernetes.io/name: polizas
    app.kubernetes.io/component: negocio
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: polizas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polizas
        app.kubernetes.io/component: negocio
    spec:
      serviceAccountName: solventa-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: polizas
      containers:
      - name: polizas
        image: solventa/polizas:local
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVICE_NAME
          value: polizas
        envFrom:
        - configMapRef:
            name: solventa-platform
        - configMapRef:
            name: solventa-services
        - secretRef:
            name: db-polizas
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 256Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: polizas
  labels:
    app.kubernetes.io/name: polizas
    app.kubernetes.io/component: negocio
spec:
  selector:
    app.kubernetes.io/name: polizas
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: polizas
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: polizas
