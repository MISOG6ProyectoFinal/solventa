apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: solventa
labels:
  - pairs:
      app.kubernetes.io/part-of: solventa
resources:
  - serviceaccount.yaml
  - services-config.yaml
  - network-policy.yaml
  - ingress.yaml
  - services/canales.yaml
  - services/cotizacion.yaml
  - services/polizas.yaml
  - services/identidad.yaml
  - services/siniestros.yaml
  - services/pagos.yaml
  - services/auditoria.yaml
  - services/health-monitor.yaml
  - services/siniestros-worker.yaml

patches:
  # Despliegue sin caída: un pod viejo sale solo cuando su reemplazo ya pasa la
  # readinessProbe. Si en 5 minutos no avanza, el rollout se marca fallido y el
  # pipeline vuelve a la revisión anterior.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 0
      - op: add
        path: /spec/progressDeadlineSeconds
        value: 300
  # Kubernetes inyecta por cada Service variables como COTIZACION_PORT=tcp://<ip>:80,
  # que chocan con los ajustes del servicio del mismo nombre. Los servicios se
  # encuentran por DNS, así que la inyección se desactiva en todos los pods.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false
