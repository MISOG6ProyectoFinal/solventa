# Overlay para EKS. El ConfigMap solventa-platform y los Secret db-* los crea
# Terraform (stack platform). La versión de las imágenes la fija
# deploy/scripts/set-image-tag.sh al desplegar; aquí no se commitea.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - keda-workers.yaml

patches:
  # Las réplicas de estos Deployments las gobierna el HPA o KEDA. Sin este parche,
  # cada despliegue las devolvería al valor del manifiesto en mitad de un pico.
  - target:
      kind: Deployment
      name: (canales|cotizacion|siniestros-worker)
    patch: |-
      - op: remove
        path: /spec/replicas
  - target:
      kind: Deployment
      name: (polizas|identidad|siniestros|pagos|auditoria)
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: canales
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: Deployment
      name: (canales|cotizacion|siniestros-worker)
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
  - target:
      kind: Deployment
      name: (polizas|identidad|siniestros|pagos|auditoria|health-monitor)
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
