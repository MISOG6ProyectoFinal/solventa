apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: solventa
resources:
  - ../../base

components:
  - ../../components/k3s

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ecr
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ecr
