apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: solventa
resources:
  - ../local
  - cnpg.yaml
  - kube-state-metrics.yaml

images:
  - name: solventa/canales
    newTag: ha-local
  - name: solventa/identidad
    newTag: ha-local
  - name: solventa/cotizacion
    newTag: ha-local
  - name: solventa/polizas
    newTag: ha-local
  - name: solventa/siniestros
    newTag: ha-local
  - name: solventa/pagos
    newTag: ha-local
  - name: solventa/simuladores
    newTag: ha-local

patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  - target:
      kind: Service
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - target:
      kind: Secret
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres
  - target:
      kind: ConfigMap
      name: postgres-init
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgres-init
  - target:
      kind: Secret
      name: db-(cotizacion|polizas|siniestros|identidad|pagos|auditoria)
    patch: |-
      - op: replace
        path: /data/DB_HOST
        value: c29sdmVudGEtcGctcnc=
  - target:
      kind: Deployment
      name: siniestros
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "true"
  - target:
      kind: Deployment
      name: (canales|cotizacion|polizas)
    patch: |-
      - op: add
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: (identidad|siniestros|pagos)
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: (auditoria|health-monitor|siniestros-worker)
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: HorizontalPodAutoscaler
      name: (canales|cotizacion|polizas)
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: (canales|cotizacion|polizas|identidad|siniestros|pagos)
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      kind: Deployment
      name: (canales|cotizacion|polizas|identidad|siniestros|pagos)
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
  - target:
      kind: Deployment
      name: (canales|cotizacion|polizas|identidad|siniestros|pagos)
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/0/minDomains
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 96Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 20m
  - target:
      kind: Deployment
      name: (redis|localstack|simuladores)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: "true"
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  - target:
      kind: Deployment
      name: localstack
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
  - target:
      kind: NetworkPolicy
      name: solventa-ingress
    patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
