apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7
          ports: [{containerPort: 6379}]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: localstack}
  template:
    metadata:
      labels: {app.kubernetes.io/name: localstack}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: localstack
          image: localstack/localstack:3
          env:
            - {name: SERVICES, value: "sns,sqs,s3"}
            - {name: LOCALSTACK_HOST, value: localstack}
          ports: [{containerPort: 4566}]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - {name: init, mountPath: /etc/localstack/init/ready.d}
      volumes:
        - name: init
          configMap: {name: localstack-init, defaultMode: 0755}
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: localstack}
  ports: [{port: 4566, nodePort: 30566}]
