# Sustitutos locales de RDS, ElastiCache y SNS/SQS/S3. Solo para desarrollo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_USER, value: solventa}
            - {name: POSTGRES_PASSWORD, value: solventa}
            - {name: POSTGRES_DB, value: solventa}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      containers:
        - name: redis
          image: redis:7
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: localstack}
  template:
    metadata:
      labels: {app.kubernetes.io/name: localstack}
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3
          env:
            - {name: SERVICES, value: "sns,sqs,s3"}
            - {name: LOCALSTACK_HOST, value: localstack}
          ports: [{containerPort: 4566}]
          volumeMounts:
            - {name: init, mountPath: /etc/localstack/init/ready.d}
      volumes:
        - name: init
          configMap: {name: localstack-init, defaultMode: 0755}
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
spec:
  selector: {app.kubernetes.io/name: localstack}
  ports: [{port: 4566}]
