[project]
name = "pagos"
version = "0.1.0"
description = "Pagos: Cobros y pagos en el perímetro PCI."
requires-python = ">=3.11"
dependencies = ["solventa-common"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# The backend pyproject has [tool.ruff], so Pyrefly treats that directory as the
# project root and cannot see this package. This section makes this directory the root.
[tool.pyrefly]
preset = "basic"
search-path = ["../../libs/solventa_common"]
