[project]
name = "api-socios"
version = "0.1.0"
description = "API Pública de Socios: Contrato versionado y aislamiento por socio."
requires-python = ">=3.11"
dependencies = ["solventa-common"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
